name: security-regression

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "security/**"]

permissions:
  contents: read

jobs:
  security-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install --upgrade pytest

      - name: Run financial security regression tests
        run: python -m pytest -q tests/test_financial_security_gates.py
